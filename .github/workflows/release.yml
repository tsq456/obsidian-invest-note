name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");

          if (manifest.version !== pkg.version) {
            throw new Error(`manifest.json version (${manifest.version}) must match package.json version (${pkg.version}).`);
          }

          if (manifest.version !== tag) {
            throw new Error(`Tag version (${tag}) must match manifest.json version (${manifest.version}).`);
          }
          NODE

      - name: Build plugin
        run: npm run build

      - name: Prepare release assets
        run: |
          mkdir -p release/data
          cp manifest.json main.js styles.css release/
          cp data/stocks.seed.json release/data/
          cd release
          zip -r ../investment-notes.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
            investment-notes.zip
          generate_release_notes: true
